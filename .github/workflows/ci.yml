name: CI

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "I explicitly approve consuming Actions minutes for this run"
        type: boolean
        required: true
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dbt-build:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.approved
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          pipx install meltano && meltano install
      - name: Run Extract and Load
        run: meltano run tap-jaffle-shop target-duckdb
      - name: Install dbt Dependencies
        run: dbt deps
      - name: dbt Build
        run: dbt build
